<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda de turnos · TurnoMed</title>
    <meta name="description" content="Consulta de disponibilidad y turnos por profesional y fecha." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6f6b' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='3'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3Cpath d='M12 14v4M10 16h4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/agenda.css" />
  </head>
  <body>
    <div class="app">
      <header id="app-header" class="header"></header>

      <main id="contenido" class="principal">
        <section class="seccion" aria-labelledby="titulo-agenda">
          <div class="seccion__cabecera">
            <div>
              <h1 id="titulo-agenda" class="seccion__titulo">Agenda de turnos</h1>
              <p class="seccion__ayuda" id="ayuda-agenda">
                Elegí una especialidad, un profesional y una fecha para ver los horarios libres y
                ocupados.
              </p>
            </div>
            <a class="boton boton--primario boton--compacto" href="turno-form.html" id="solicitar">
              Solicitar turno
            </a>
          </div>

          <div class="zona-mensajes" data-zona-mensajes></div>

          <form class="filtros" id="filtros" aria-label="Filtros de la agenda">
            <div class="campo">
              <label class="campo__etiqueta" for="especialidad">Especialidad</label>
              <select class="campo__control" id="especialidad"></select>
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="profesional">Profesional</label>
              <select class="campo__control" id="profesional"></select>
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="fecha">Fecha</label>
              <input class="campo__control" type="date" id="fecha" />
            </div>

            <div class="campo">
              <label class="campo__etiqueta" for="vista">Período</label>
              <select class="campo__control" id="vista">
                <option value="dia">Solo el día</option>
                <option value="semana">Toda la semana</option>
              </select>
            </div>

            <div class="filtros__pie">
              <p class="filtros__resumen" id="resumen" role="status"></p>
              <div class="filtros__acciones">
                <button class="boton boton--secundario boton--compacto" type="button" id="hoy">
                  Hoy
                </button>
                <button class="boton boton--fantasma boton--compacto" type="button" id="limpiar">
                  Limpiar filtros
                </button>
              </div>
            </div>
          </form>

          <div class="leyenda" aria-hidden="true">
            <span class="leyenda__item">
              <span class="leyenda__muestra leyenda__muestra--libre"></span> Libre
            </span>
            <span class="leyenda__item">
              <span class="leyenda__muestra leyenda__muestra--ocupado"></span> Ocupado
            </span>
            <span class="leyenda__item">
              <span class="badge badge--pendiente">Pendiente</span>
            </span>
            <span class="leyenda__item">
              <span class="badge badge--confirmado">Confirmado</span>
            </span>
            <span class="leyenda__item">
              <span class="badge badge--en_consultorio">En consultorio</span>
            </span>
            <span class="leyenda__item">
              <span class="badge badge--asistido">Asistido</span>
            </span>
          </div>

          <div id="agenda" class="agenda" aria-live="polite"></div>
        </section>
      </main>

      <footer class="footer">
        <div id="app-footer"></div>
      </footer>
    </div>

    <script type="module" src="../js/pages/agenda.js"></script>
  </body>
</html>
