<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel principal · TurnoMed</title>
    <meta name="description" content="Resumen de la actividad del día según el rol del usuario." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6f6b' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='3'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3Cpath d='M12 14v4M10 16h4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <div class="app">
      <header id="app-header" class="header"></header>

      <main id="contenido" class="principal">
        <section class="seccion" aria-labelledby="titulo-panel">
          <div class="seccion__cabecera">
            <div>
              <p class="saludo__saludo" id="saludo"></p>
              <h1 id="titulo-panel" class="seccion__titulo">Panel principal</h1>
              <p class="seccion__ayuda" id="ayuda-panel"></p>
            </div>
          </div>

          <div class="zona-mensajes" data-zona-mensajes></div>

          <section aria-labelledby="titulo-indicadores">
            <h2 id="titulo-indicadores" class="sr-solo">Indicadores del día</h2>
            <div class="rejilla rejilla--4" id="indicadores"></div>
          </section>
        </section>

        <section class="seccion" aria-labelledby="titulo-accesos">
          <div class="seccion__cabecera">
            <div>
              <h2 id="titulo-accesos" class="seccion__titulo">Accesos rápidos</h2>
              <p class="seccion__ayuda">Las acciones más usadas para tu rol.</p>
            </div>
          </div>
          <div class="rejilla rejilla--3" id="accesos"></div>
        </section>

        <section class="seccion" aria-labelledby="titulo-proximos">
          <div class="seccion__cabecera">
            <div>
              <h2 id="titulo-proximos" class="seccion__titulo">Próximos turnos</h2>
              <p class="seccion__ayuda" id="ayuda-proximos"></p>
            </div>
            <a class="boton boton--secundario boton--compacto" href="agenda.html">Ver agenda completa</a>
          </div>
          <div class="lista-turnos" id="proximos" aria-live="polite"></div>
        </section>

        <section class="seccion" aria-labelledby="titulo-estados">
          <div class="seccion__cabecera">
            <div>
              <h2 id="titulo-estados" class="seccion__titulo">Turnos por estado</h2>
              <p class="seccion__ayuda">Distribución de las reservas registradas.</p>
            </div>
          </div>
          <div class="rejilla rejilla--3" id="estados"></div>
        </section>
      </main>

      <footer class="footer">
        <div id="app-footer"></div>
      </footer>
    </div>

    <script type="module" src="../js/pages/dashboard.js"></script>
  </body>
</html>
