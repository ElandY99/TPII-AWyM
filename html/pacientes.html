<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pacientes · TurnoMed</title>
    <meta name="description" content="Alta y consulta de pacientes del sistema de turnos." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6f6b' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='3'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3Cpath d='M12 14v4M10 16h4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pacientes.css" />
  </head>
  <body>
    <div class="app">
      <header id="app-header" class="header"></header>

      <main id="contenido" class="principal">
        <section class="seccion" aria-labelledby="titulo-seccion">
          <div class="seccion__cabecera">
            <div>
              <h1 id="titulo-seccion" class="seccion__titulo">Pacientes</h1>
              <p class="seccion__ayuda" id="ayuda-seccion">
                Registrá pacientes nuevos y consultá los que ya están cargados. El DNI es la clave
                única del sistema.
              </p>
            </div>
            <button class="boton boton--primario" type="button" id="nuevo-paciente">
              Nuevo paciente
            </button>
          </div>

          <div class="zona-mensajes" data-zona-mensajes></div>

          <div class="busca">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm9 16-4.5-4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <label class="sr-solo" for="filtro">Buscar paciente por DNI, nombre o apellido</label>
            <input
              class="campo__control"
              type="search"
              id="filtro"
              placeholder="Buscar por DNI, nombre, apellido o correo"
              autocomplete="off"
            />
          </div>

          <p class="listado__conteo" id="conteo" role="status"></p>

          <div id="listado" class="listado" aria-live="polite"></div>
        </section>
      </main>

      <footer class="footer">
        <div id="app-footer"></div>
      </footer>
    </div>

    <dialog id="dialogo-paciente" class="dialogo" aria-labelledby="dialogo-titulo">
      <form id="formulario-paciente" class="dialogo__form" novalidate>
        <header class="dialogo__cabecera">
          <h2 id="dialogo-titulo" class="dialogo__titulo">Nuevo paciente</h2>
          <button
            class="dialogo__cerrar"
            type="button"
            id="cerrar-dialogo"
            aria-label="Cerrar sin guardar"
          >
            ×
          </button>
        </header>

        <div class="zona-mensajes zona-mensajes--dialogo" data-zona-mensajes-form></div>

        <div class="formulario formulario--filas">
          <div class="campo">
            <label class="campo__etiqueta" for="dni">
              DNI <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="text"
              id="dni"
              name="dni"
              inputmode="numeric"
              maxlength="8"
              placeholder="30111222"
              required
              aria-required="true"
            />
            <p class="campo__ayuda">7 u 8 dígitos, sin letras ni puntos.</p>
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="obraSocial">
              Obra social <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="text"
              id="obraSocial"
              name="obraSocial"
              placeholder="OSDE"
              required
              aria-required="true"
            />
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="nombre">
              Nombre <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="given-name"
              placeholder="Lucía"
              required
              aria-required="true"
            />
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="apellido">
              Apellido <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="text"
              id="apellido"
              name="apellido"
              autocomplete="family-name"
              placeholder="Fernández"
              required
              aria-required="true"
            />
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="fechaNacimiento">
              Fecha de nacimiento <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="date"
              id="fechaNacimiento"
              name="fechaNacimiento"
              autocomplete="bday"
              required
              aria-required="true"
            />
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="telefono">
              Teléfono <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="tel"
              id="telefono"
              name="telefono"
              inputmode="numeric"
              maxlength="11"
              autocomplete="tel"
              placeholder="3514567890"
              required
              aria-required="true"
            />
            <p class="campo__ayuda">10 u 11 dígitos, con código de área.</p>
          </div>

          <div class="campo campo--ancho">
            <label class="campo__etiqueta" for="correo">
              Correo electrónico <span class="campo__requerido" aria-hidden="true">*</span>
            </label>
            <input
              class="campo__control"
              type="email"
              id="correo"
              name="correo"
              inputmode="email"
              autocomplete="email"
              placeholder="nombre@correo.com"
              required
              aria-required="true"
            />
          </div>
        </div>

        <footer class="dialogo__acciones">
          <button class="boton boton--secundario" type="button" id="cancelar-alta">
            Cancelar
          </button>
          <button class="boton boton--primario" type="submit" id="guardar-paciente">
            Guardar paciente
          </button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="../js/pages/pacientes.js"></script>
  </body>
</html>
